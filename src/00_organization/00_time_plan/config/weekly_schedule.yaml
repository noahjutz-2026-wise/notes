    - from: "06:30"
      to: "07:30"
      body: "get ready"
    - from: "08:00"
      to: "11:00"
      body: "bib"
      pomodoro: true
    - from: "12:00"
      to: "13:30"
      body: "bib"
      pomodoro: true
    - from: "13:30"
      to: "14:15"
      body: "Q&A"
    - from: "14:15"
      to: "19:00"
      body: "bib"
